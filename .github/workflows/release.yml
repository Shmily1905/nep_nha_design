name: Phát hành tiện ích SketchUp

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Kiểm tra và đóng gói RBZ
        run: |
          ruby -c nep_nha_design.rb
          for script in nep_nha_design/*.rb; do ruby -c "$script" || exit 1; done
          ruby <<'RUBY'
          $LOADED_FEATURES << 'sketchup.rb'
          require_relative 'nep_nha_design/su_mcp_bridge'
          bridge = NepNhaDesign::Bridge
          model = Struct.new(:selection).new([])
          abort 'Empty selection failed' unless bridge.selection_info(model) == []
          entity = Struct.new(:persistent_id, :typename, :name).new(123, 'Group', 'Wall')
          model.selection << entity
          abort 'Selection snapshot failed' unless bridge.selection_info(model) == [
            { id: 123, type: 'Group', name: 'Wall' }
          ]
          # A guarded image session must reject operations from a later layer.
          bridge.pin_model('staged-image', model, [960, 720])
          bridge.start_image_stage('staged-image', 0)
          state = bridge.instance_variable_get(:@model_pins).fetch('staged-image')
          begin
            bridge.send(:dispatch_image_stage, state, 'cut_existing_wall', {})
            abort 'Image stage allowed a premature cut'
          rescue NepNhaDesign::Bridge::RPCError => e
            abort 'Unexpected image stage error' unless e.code == -32602
          ensure
            bridge.release_model_pin('staged-image')
          end
          RUBY
          python3 scripts/build_rbz.py --tag "$GITHUB_REF_NAME"
          unzip -t "dist/Nep-Nha-Design-Tro-Ly-ChatGPT-$GITHUB_REF_NAME.rbz"
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Nep-Nha-Design-Tro-Ly-ChatGPT-$GITHUB_REF_NAME.rbz" \
            --verify-tag --title "Nếp Nhà Design $GITHUB_REF_NAME" --generate-notes --latest
