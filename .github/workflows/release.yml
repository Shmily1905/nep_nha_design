name: Phát hành tiện ích SketchUp

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Kiểm tra và đóng gói RBZ
        run: |
          ruby -c nep_nha_design.rb
          for script in nep_nha_design/*.rb; do ruby -c "$script" || exit 1; done
          python3 scripts/build_rbz.py --tag "$GITHUB_REF_NAME"
          unzip -t "dist/Nep-Nha-Design-Tro-Ly-ChatGPT-$GITHUB_REF_NAME.rbz"
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Nep-Nha-Design-Tro-Ly-ChatGPT-$GITHUB_REF_NAME.rbz" \
            --verify-tag --title "Nếp Nhà Design $GITHUB_REF_NAME" --generate-notes --latest
